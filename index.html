<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StructPath — Civil & Structural Engineering Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --paper: #f8fafc;
  --paper-2: #eef6ff;
  --paper-3: #dbeafe;
  --white: #ffffff;
  --border: rgba(37,99,235,0.14);
  --border-m: rgba(37,99,235,0.24);
  --radius: 10px;
  --radius-lg: 18px;
  --radius-xl: 26px;
  --shadow: 0 18px 50px rgba(30,58,138,0.10);
  --blue-deep: #1e3a8a;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --accent: #0ea5e9;
  --foundation: #475569;
  --design: #2563eb;
  --site: #0ea5e9;
  --oilgas: #0f766e;
  --geotech: #16a34a;
  --pm: #7c3aed;
  --digital: #0284c7;
  --career: #1e40af;
}
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Outfit', sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
}
button, a { -webkit-tap-highlight-color: transparent; }
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(37,99,235,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37,99,235,.07) 1px, transparent 1px),
    radial-gradient(circle at 18% 10%, rgba(14,165,233,.18), transparent 26%),
    radial-gradient(circle at 85% 5%, rgba(37,99,235,.13), transparent 28%);
  background-size: 46px 46px, 46px 46px, auto, auto;
}
.site-header, .track-bar, .layout { position: relative; z-index: 1; }
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 2rem;
  background: rgba(248,250,252,0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}
.brand-block { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
.logo {
  font-family: 'DM Serif Display', serif;
  color: var(--ink);
  text-decoration: none;
  font-size: 1.28rem;
  letter-spacing: -.02em;
}
.logo span { color: var(--blue); font-style: italic; }
.brand-tagline {
  font-family: 'DM Mono', monospace;
  font-size: .58rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 4px;
}
.header-right { display: flex; align-items: center; gap: 10px; }
.progress-pill {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--ink-3);
  border: 1px solid var(--border-m);
  background: var(--white);
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}
.take-assessment-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  background: var(--blue-deep);
  color: white;
  border-radius: var(--radius);
  padding: 8px 13px;
  font-size: 0.82rem;
  font-weight: 700;
  transition: background .18s, transform .18s;
}
.take-assessment-btn:hover { background: var(--blue); transform: translateY(-1px); }
.track-bar {
  position: sticky;
  top: 65px;
  z-index: 90;
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 2rem;
  background: rgba(248,250,252,0.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}
.track-bar::-webkit-scrollbar { display: none; }
.track-btn {
  border: 0;
  background: transparent;
  cursor: pointer;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 13px 15px;
  font-family: 'Outfit', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.track-btn:hover, .track-btn.active { color: var(--blue-deep); }
.track-btn.active { border-bottom-color: var(--blue); }
.track-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 116px); }
.sidebar {

  top: 116px;
  height: calc(100vh - 116px);

  border-right: 1px solid var(--border);
  padding: 1.4rem 1.2rem;
  background: rgba(248,250,252,.55);
}
.sidebar-title {
  font-family: 'DM Mono', monospace;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .09em;
  font-size: .66rem;
  margin-bottom: .8rem;
}
.side-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,.78);
  padding: .95rem;
  margin-bottom: 1rem;
  box-shadow: 0 8px 28px rgba(30,58,138,.05);
}
.side-card h3 { font-size: .84rem; margin-bottom: .35rem; color: var(--blue-deep); }
.side-card p { font-size: .76rem; color: var(--ink-2); line-height: 1.55; }
.side-link {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;

  border-radius: 10px;
}
.side-link:hover { background: var(--blue-soft); color: var(--blue-deep); }
.side-count { font-family: 'DM Mono', monospace; font-size: .66rem; }
.canvas { padding: 2.35rem 3rem 4rem; overflow-x: hidden; }
.panel { display: none; }
.panel.active { display: block; }
.hero { max-width: 980px; margin-bottom: 2rem; }
.eyebrow {
  font-family: 'DM Mono', monospace;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .72rem;
  margin-bottom: .85rem;
}
.hero h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2rem, 5vw, 3.75rem);
  line-height: 1.03;
  letter-spacing: -.04em;
  margin-bottom: 1rem;
  color: #0f172a;
}
.hero h1 em { color: var(--blue); font-style: italic; }
.hero p { max-width: 790px; color: var(--ink-2); line-height: 1.75; font-size: .99rem; }
.intro-shell {
  max-width: 1120px;
  margin-bottom: 1.5rem;
  padding: clamp(1.4rem, 4vw, 3.2rem);
  border-radius: 32px;
  background:
    radial-gradient(circle at 18% 20%, rgba(14,165,233,.22), transparent 30%),
    radial-gradient(circle at 90% 15%, rgba(37,99,235,.20), transparent 26%),
    linear-gradient(135deg, #0f172a, #172554 58%, #1e3a8a);

  overflow: hidden;
}
.intro-shell::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
  pointer-events: none;
}
.intro-content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; text-align: center; }
.intro-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.08);
  border-radius: 999px;
  padding: 7px 12px;
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #bfdbfe;
  margin-bottom: 1.15rem;
}
.intro-content h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2.4rem, 7vw, 5rem);
  line-height: .96;
  letter-spacing: -.055em;
  margin-bottom: 1.1rem;
}
.intro-content h1 span {
  background: linear-gradient(90deg, #93c5fd, #ffffff, #38bdf8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.intro-lead {
  max-width: 820px;
  margin: 0 auto;
  color: rgba(255,255,255,.82);
  font-size: clamp(.98rem, 1.8vw, 1.18rem);
  line-height: 1.75;
}
.intro-support {
  max-width: 760px;
  margin: 1rem auto 0;
  color: rgba(219,234,254,.86);
  line-height: 1.7;
  font-size: .94rem;
}
.intro-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: .75rem;
  margin-top: 1.6rem;
}
.intro-btn {
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 999px;
  padding: 11px 16px;
  font-family: 'Outfit', sans-serif;
  font-size: .86rem;
  font-weight: 800;
  cursor: pointer;
  color: white;
  background: rgba(255,255,255,.10);
  transition: transform .16s, background .16s;
}
.intro-btn.primary { background: #2563eb; border-color: #60a5fa; }
.intro-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
.intro-btn.primary:hover { background: #1d4ed8; }
.intro-highlight {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 1.4rem auto 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: .75rem;
}
.intro-card {
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  border-radius: 18px;
  padding: .95rem;
  text-align: left;
  backdrop-filter: blur(8px);
}
.intro-card strong { display: block; color: white; font-size: .86rem; margin-bottom: .3rem; }
.intro-card span { display: block; color: rgba(219,234,254,.78); font-size: .75rem; line-height: 1.45; }
@media (max-width: 860px) {
  .intro-highlight { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 540px) {
  .intro-highlight { grid-template-columns: 1fr; }
  .intro-content { text-align: left; }
  .intro-actions { justify-content: flex-start; }
}
.mind-map-wrap {
  max-width: 1120px;
  border: 1px solid rgba(37,99,235,.18);
  border-radius: var(--radius-xl);
  background:
    radial-gradient(circle at 50% 48%, rgba(37,99,235,.12), transparent 32%),
    linear-gradient(135deg, rgba(255,255,255,.97), rgba(239,246,255,.92));
  padding: clamp(1rem, 3vw, 2rem);
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}
.mind-map-wrap::before {
  content: '';
  position: absolute;
  inset: 20px;
  border-radius: 20px;
  border: 1px dashed rgba(37,99,235,.18);
  pointer-events: none;
}
.mind-map-heading { position: relative; z-index: 1; max-width: 790px; margin-bottom: 1.5rem; }
.mind-map-heading h2 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.55rem, 3vw, 2.4rem);
  line-height: 1.08;
  letter-spacing: -.025em;
  margin-bottom: .6rem;
  color: var(--blue-deep);
}
.mind-map-heading p { color: var(--ink-2); line-height: 1.65; font-size: .92rem; }
.mind-map {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  grid-template-areas:
    '. design .'
    'site core oilgas'
    'pm digital career';
  gap: 1rem;
  align-items: stretch;
}
.mind-node {
  border: 1px solid rgba(37,99,235,.16);
  border-radius: 18px;
  background: rgba(255,255,255,.88);
  padding: 1rem;
  min-height: 132px;
  cursor: pointer;
  box-shadow: 0 12px 34px rgba(15,23,42,.07);
  transition: transform .18s, border-color .18s, box-shadow .18s;
  text-align: left;
  font-family: 'Outfit', sans-serif;
}
.mind-node:hover { transform: translateY(-4px); border-color: rgba(37,99,235,.45); box-shadow: 0 18px 44px rgba(37,99,235,.14); }
.mind-node.core {
  grid-area: core;
  background: linear-gradient(135deg, var(--blue-deep), var(--blue));
  color: white;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.mind-node.design { grid-area: design; }
.mind-node.site { grid-area: site; }
.mind-node.oilgas { grid-area: oilgas; }
.mind-node.pm { grid-area: pm; }
.mind-node.digital { grid-area: digital; }
.mind-node.career { grid-area: career; }
.mind-icon { font-size: 1.65rem; margin-bottom: .55rem; display: block; }
.mind-title { font-weight: 800; color: var(--blue-deep); margin-bottom: .35rem; font-size: .96rem; }
.mind-node.core .mind-title { color: white; font-size: 1.05rem; }
.mind-desc { color: #475569; font-size: .78rem; line-height: 1.5; }
.mind-node.core .mind-desc { color: rgba(255,255,255,.84); }
.mind-meta {
  display: inline-flex;
  margin-top: .75rem;
  font-family: 'DM Mono', monospace;
  font-size: .64rem;
  color: var(--blue);
  background: rgba(37,99,235,.08);
  border-radius: 999px;
  padding: 4px 8px;
}
.mind-node.core .mind-meta { color: white; background: rgba(255,255,255,.14); }
.route-bridge {
  max-width: 1120px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: .85rem;
  margin-bottom: 1.3rem;
}
.bridge-card {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.78);
  border-radius: 16px;
  padding: 1rem;
  box-shadow: 0 8px 28px rgba(30,58,138,.05);
}
.bridge-card h3 { font-size: .9rem; color: var(--blue-deep); margin-bottom: .35rem; }
.bridge-card p { font-size: .78rem; color: var(--ink-2); line-height: 1.55; }
.notice {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 12px;
  align-items: start;
  border: 1px solid rgba(14,165,233,.24);
  background: rgba(239,246,255,.78);
  border-radius: var(--radius-lg);
  padding: 1rem;
  margin: 1.5rem 0;
  max-width: 980px;
}
.notice-icon { font-size: 1.35rem; }
.notice h3 { font-size: .9rem; margin-bottom: .25rem; color: var(--blue-deep); }
.notice p { color: var(--ink-2); font-size: .84rem; line-height: 1.55; }
.track-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  max-width: 1120px;
}
.track-card {
  background: rgba(255,255,255,.94);
  padding: 1.25rem;
  cursor: pointer;
  transition: background .16s, transform .16s;
}
.track-card:hover { background: var(--blue-soft); }
.card-icon { font-size: 1.55rem; margin-bottom: .65rem; }
.card-title { font-weight: 800; margin-bottom: .35rem; font-size: .98rem; }
.card-desc { font-size: .8rem; color: var(--ink-2); line-height: 1.55; margin-bottom: .75rem; }
.card-meta { font-family: 'DM Mono', monospace; color: var(--ink-3); font-size: .68rem; }
.track-header { max-width: 940px; margin-bottom: 1.6rem; }
.track-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: .8rem;
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 6px 10px;
  border: 1px solid var(--border-m);
}
.track-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.7rem, 3vw, 2.35rem);
  line-height: 1.08;
  letter-spacing: -.02em;
  margin-bottom: .6rem;
}
.track-desc { color: var(--ink-2); line-height: 1.7; font-size: .94rem; max-width: 790px; }
.track-outcomes { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 1rem; }
.outcome-chip {
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  color: var(--ink-2);
  border: 1px solid var(--border);
  background: white;
  padding: 4px 8px;
  border-radius: 999px;
}
.career-map-note {
  max-width: 940px;
  margin: 1.1rem 0;
  border: 1px solid rgba(37,99,235,.18);
  border-radius: var(--radius-lg);
  background: rgba(239,246,255,.65);
  padding: 1rem;
  color: var(--ink-2);
  line-height: 1.6;
  font-size: .84rem;
}
.roadmap-flow {
  max-width: 1120px;
  margin: 1.25rem 0 1.7rem;
  padding: 1.5rem;
  border: 1px solid rgba(37,99,235,.18);
  border-radius: var(--radius-xl);
  background: rgba(255,255,255,.82);
  box-shadow: 0 18px 50px rgba(30,58,138,.08);
  overflow-x: auto;
}
.flow-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.4rem;
}
.flow-title h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.45rem;
  color: var(--blue-deep);
  letter-spacing: -.02em;
}
.flow-title span {
  font-family: 'DM Mono', monospace;
  font-size: .68rem;
  color: var(--ink-3);
  white-space: nowrap;
}
.flow-canvas {
  min-width: 820px;
  display: grid;
  grid-template-columns: 1fr 260px 1fr;
  gap: 2.2rem;
  position: relative;
  padding: .5rem 0;
}
.flow-spine {
  grid-column: 2;
  display: grid;
  gap: .75rem;
  position: relative;
}
.flow-spine::before {
  content: '';
  position: absolute;
  top: 12px;
  bottom: 12px;
  left: 50%;
  width: 4px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: linear-gradient(var(--blue), var(--accent));
  z-index: 0;
}
.flow-main-node,
.flow-branch-node {
  border: 3px solid #020617;
  border-radius: 8px;
  background: #fff200;
  padding: .75rem .9rem;
  text-align: center;
  font-weight: 800;
  font-size: .88rem;
  color: #020617;
  position: relative;
  z-index: 1;
  box-shadow: 0 4px 0 rgba(2,6,23,.12);
}
.flow-main-node small,
.flow-branch-node small {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: .58rem;
  color: #475569;
  margin-top: .2rem;
  font-weight: 500;
}
.flow-left,
.flow-right {
  display: grid;
  align-content: start;
  gap: .75rem;
  padding-top: 1rem;
}
.flow-left { grid-column: 1; }
.flow-right { grid-column: 3; }
.flow-branch-node {
  background: #fee8a1;
  min-height: 54px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.flow-branch-node::after,
.flow-branch-node::before {
  content: '';
  position: absolute;
  top: 50%;
  width: 2.25rem;
  border-top: 4px dotted var(--blue);
}
.flow-left .flow-branch-node::after { right: -2.35rem; }
.flow-right .flow-branch-node::before { left: -2.35rem; }
.flow-branch-node.done-mark::marker { display: none; }
.flow-note-box {
  max-width: 390px;
  border: 1px solid rgba(37,99,235,.14);
  background: #f8fafc;
  border-radius: 14px;
  padding: 1rem;
  color: var(--ink-2);
  font-size: .82rem;
  line-height: 1.55;
}
.flow-note-box strong { color: var(--blue-deep); }
@media (max-width: 760px) {
  .roadmap-flow { padding: 1rem; }
  .flow-title { align-items: flex-start; flex-direction: column; }
  .flow-canvas { min-width: 720px; grid-template-columns: 1fr 230px 1fr; gap: 1.6rem; }
  .flow-branch-node::after,
  .flow-branch-node::before { width: 1.65rem; }
  .flow-left .flow-branch-node::after { right: -1.75rem; }
  .flow-right .flow-branch-node::before { left: -1.75rem; }
}
.phase {
  max-width: 1020px;
  margin-bottom: .85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: rgba(255,255,255,.88);
  box-shadow: 0 8px 28px rgba(30,58,138,.045);
}
.phase-head {
  width: 100%;
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: left;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 1rem 1.1rem;
  font-family: 'Outfit', sans-serif;
}
.phase-head:hover { background: rgba(239,246,255,.7); }
.phase-kicker { font-family: 'DM Mono', monospace; color: var(--ink-3); font-size: .67rem; text-transform: uppercase; letter-spacing: .07em; }
.phase-name { font-weight: 800; color: var(--ink); font-size: .98rem; margin-top: .15rem; }

.phase-body { display: none; padding: 0 1.1rem 1.1rem; }

.module-list { display: grid; gap: 9px; }
.module { border: 1px solid var(--border); border-radius: var(--radius); background: white; overflow: hidden; }

  background: transparent;

.module-head:hover { background: rgba(239,246,255,.6); }
.module-icon { font-size: 1.15rem; line-height: 1.1; }
.module-title { display: block; font-size: .9rem; font-weight: 800; color: var(--ink); }
.module-sub { display: block; color: var(--ink-3); font-size: .76rem; line-height: 1.4; margin-top: 2px; }
.done-btn {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  border: 1.5px solid var(--border-m);
  background: white;
  color: white;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: .75rem;
  flex-shrink: 0;
}
.module.done .done-btn { background: var(--blue); border-color: var(--blue); }
.module-body { display: none; border-top: 1px solid var(--border); padding: .9rem; }
.module.open .module-body { display: block; }
.detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.detail h4 {
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-3);
  font-size: .64rem;
  margin-bottom: .45rem;
}
ul.clean { list-style: none; display: grid; gap: 5px; }
ul.clean li { position: relative; padding-left: 14px; color: var(--ink-2); font-size: .78rem; line-height: 1.45; }
ul.clean li::before { content: '→'; position: absolute; left: 0; color: var(--blue); }
.route-note {
  margin-top: .8rem;
  border-radius: var(--radius);
  padding: .75rem .85rem;
  background: rgba(14,165,233,.08);
  border: 1px solid rgba(14,165,233,.18);
  color: var(--ink-2);
  font-size: .78rem;
  line-height: 1.5;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.1rem; }
.btn {
  border: 1px solid var(--border-m);
  border-radius: var(--radius);
  padding: 9px 12px;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: .8rem;
  font-weight: 800;
  background: white;
  color: var(--ink);
}
.btn.primary { background: var(--blue-deep); color: white; border-color: var(--blue-deep); }
.btn:hover { transform: translateY(-1px); }
.footer-note { max-width: 940px; margin-top: 2rem; color: var(--ink-3); font-size: .76rem; line-height: 1.6; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .canvas { padding: 1.5rem 1rem 3rem; }
  .site-header { padding: 1rem; }
  .track-bar { top: 65px; padding: 0 1rem; }
  .detail-grid { grid-template-columns: 1fr; }
  .header-right { gap: 6px; }
  .progress-pill { display: none; }
}

  .phase-head { grid-template-columns: auto 1fr; }
  .phase-count { display: none; }
}

function countModules(track) { return track.phases.reduce((n,p)=>n+p.modules.length,0); }
function totalModules() { return TRACKS.reduce((n,t)=>n+countModules(t),0); }
function doneCount() { return Object.values(done).filter(Boolean).length; }
function saveDone() { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); updateProgress(); }
function updateProgress() { document.getElementById('progress-pill').textContent = `${doneCount()} / ${totalModules()} done`; }

}

    ${renderRoadmapFlow(track)}
    ${track.careerNote ? `<div class="career-map-note"><strong>Career roadmap:</strong> ${track.careerNote}</div>` : ''}

}

}

function buildSidebar(panelId = 'home') {
  const sidebar = document.getElementById('sidebar-links');
  if (panelId === 'home') {
    sidebar.innerHTML = TRACKS.map(t => `<button class="side-link" onclick="switchPanel('${t.id}')"><span>${t.icon} ${t.short}</span><span class="side-count">${countModules(t)}</span></button>`).join('');
    return;
  }
  const track = TRACKS.find(t => t.id === panelId);
  if (!track) return;
  sidebar.innerHTML = track.phases.map(p => `<button class="side-link" onclick="document.getElementById('phase-${track.id}-${p.id}').scrollIntoView({behavior:'smooth', block:'start'})"><span>${p.label} · ${p.title}</span><span class="side-count">${p.modules.length}</span></button>`).join('');
}

function switchPanel(id) {
  // ensure assessment navigation compatibility
  if(id === 'assessment'){
    window.location.href = 'assessment.html';
    return;
  }
  currentPanel = id;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('panel-' + id);
  if (!target) return;
  target.classList.add('active');
  document.querySelectorAll('.track-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === id));
  buildSidebar(id);
  if (id === 'home') {
    history.replaceState(null, '', window.location.pathname);
  } else {
    history.replaceState(null, '', '#' + id);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function togglePhase(button) {
  const phase = button.closest('.phase');
  const trackId = phase.dataset.track;
  document.querySelectorAll(`.phase[data-track="${trackId}"]`).forEach(p => { if (p !== phase) p.classList.remove('open'); });
  phase.classList.toggle('open');
}

function toggleModule(event, id) {
  if (event.target.classList.contains('done-btn')) return;
  const module = document.getElementById('module-' + id);
  const phase = module.closest('.phase');
  phase.querySelectorAll('.module').forEach(m => { if (m !== module) m.classList.remove('open'); });
  module.classList.toggle('open');
}

function toggleDone(event, id) {
  event.stopPropagation();
  done[id] = !done[id];
  const module = document.getElementById('module-' + id);
  const btn = module.querySelector('.done-btn');
  module.classList.toggle('done', done[id]);
  btn.textContent = done[id] ? '✓' : '';
  if (!done[id]) delete done[id];
  saveDone();
}

function openFirstPhase(trackId) {
  collapseAll(trackId);
  const first = document.querySelector(`.phase[data-track="${trackId}"]`);
  if (first) first.classList.add('open');
}
function expandAll(trackId) { document.querySelectorAll(`.phase[data-track="${trackId}"]`).forEach(p => p.classList.add('open')); }
function collapseAll(trackId) { document.querySelectorAll(`.phase[data-track="${trackId}"]`).forEach(p => p.classList.remove('open')); }

buildTrackBar();
buildHome();
buildTrackPanels();
buildSidebar('home');
updateProgress();

const initialTrack = window.location.hash.replace('#', '');
if (initialTrack && TRACKS.some(t => t.id === initialTrack)) {
  switchPanel(initialTrack);
}
</script>
</body>
</html>
